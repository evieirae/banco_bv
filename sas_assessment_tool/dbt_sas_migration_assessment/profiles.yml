indimesh_databricks:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: "{{ env_var('DEV_DATABRICKS_CATALOG') }}"
      schema: "{{ env_var('DEV_SCHEMA_NAME') }}"
      host: "{{ env_var('DEV_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DEV_DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      threads: 16
      ansi_mode: false
    ci:
      type: databricks
      catalog: "{{ env_var('CI_DATABRICKS_CATALOG') }}"
      schema: "{{ env_var('CI_SCHEMA_NAME') }}"
      host: "{{ env_var('CI_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('CI_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('CI_DATABRICKS_TOKEN') }}"
      ansi_mode: false
      threads: 16
    prod:
      type: databricks
      catalog: "{{ env_var('PROD_DATABRICKS_CATALOG') }}"
      schema: "{{ env_var('PROD_SCHEMA_NAME') }}"
      host: "{{ env_var('PROD_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('PROD_DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      token: "{{ env_var('PROD_DATABRICKS_TOKEN') }}"
      ansi_mode: false
      threads: 16

indimesh_snowflake:
  target: "{{ env_var('DBT_DEFAULT_TARGET') }}"
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('DEV_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DEV_SNOWFLAKE_USER') }}"
      password: "{{ env_var('DEV_SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('DEV_SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('DEV_SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('DEV_SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('DEV_SCHEMA_NAME') }}"
      private_key: "{{ env_var('DEV_SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('DEV_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
      threads: 16
    ci:
      type: snowflake
      account: "{{ env_var('CI_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('CI_SNOWFLAKE_USER') }}"
      password: "{{ env_var('CI_SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('CI_SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('CI_SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('CI_SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('CI_SCHEMA_NAME') }}"
      private_key: "{{ env_var('CI_SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('CI_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
      threads: 16
    prod:
      type: snowflake
      account: "{{ env_var('PROD_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('PROD_SNOWFLAKE_USER') }}"
      password: "{{ env_var('PROD_SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('PROD_SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('PROD_SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('PROD_SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('PROD_SCHEMA_NAME') }}"
      private_key: "{{ env_var('PROD_SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('PROD_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
      threads: 16