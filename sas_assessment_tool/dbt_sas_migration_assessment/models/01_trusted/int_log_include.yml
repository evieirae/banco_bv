version: 1

models:
  - name: int_log_include
    description: >
      Intermediate model that identifies and extracts `%INCLUDE` statements. These 
      statements represent external SAS scripts or macro files being called by the main process. 
      Mapping these is essential for full logic lineage and finding 'hidden' business rules.
    columns:
      - name: include_path
        description: "The physical path or FILEREF of the external script being called."
      - name: include_type
        description: "Identifies if the include is a direct path (`DIRECT_PATH`) or an alias (`FILEREF`)."
      - name: content
        description: "The full %INCLUDE statement as found in the log."