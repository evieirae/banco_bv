version: 1

models:

  - name: int_log_statement
    description: "Intermediate model that extracts and identifies SAS statements (PROC and DATA steps) from code blocks, grouping them by project and task."
    columns:
      - name: log_file
        description: "Name of the SAS log file from which the record was extracted."
      - name: project_name
        description: "Name of the project extracted from the SAS log block."
      - name: task_name
        description: "Name of the task extracted from the SAS log block."
      - name: type_statement
        description: "Type of SAS statement identified (e.g., 'PROC SQL', 'PROC SORT', 'PROC MEANS', 'DATA')."
      - name: statement
        description: "Complete SAS statement content with all lines concatenated, including the PROC or DATA step declaration and its body."

