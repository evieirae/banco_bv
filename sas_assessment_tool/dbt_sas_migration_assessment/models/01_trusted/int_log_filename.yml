version: 1

models:
  - name: int_log_filename
    description: >
      Intermediate model that parses `FILENAME` statements from SAS logs. It maps 
      FILEREFs (aliases) to their actual physical paths or service engines (ZIP, FTP, EMAIL, TEMP). 
      This model is critical for resolving dynamic paths that appear as aliases in other tasks.
    columns:
      - name: fileref
        description: "The alias name defined in the SAS code (e.g., MY_DATA)."
      - name: filename_type
        description: "Classification of the reference: `PATH` for physical files or `SERVICE` for engines."
      - name: connection_engine
        description: "The engine/protocol used (e.g., ZIP, FTP, BASE, EMAIL, PIPE)."
      - name: filename_path
        description: "The physical file path, directory, or connection string (e.g., /path/to/file.zip)."
      - name: file_options
        description: "Additional SAS options like ENCODING, RECFM, or LRECL."