version: 1

models:
  - name: int_log_file_import
    description: >
      Intermediate model that extracts data ingestion details from SAS logs, specifically 
      capturing `PROC IMPORT` and `INFILE` statements. It identifies the target table, 
      the type of file being read (CSV, Excel, etc.), and the raw path or alias used. 
      This is a foundational layer for building file-level lineage.
    columns:
      - name: log_file
        description: "Source log file name."
      - name: project_name
        description: "Name of the SAS Enterprise Guide project."
      - name: task_name
        description: "The specific task or program within the EGP project."
      - name: import_method
        description: "The SAS command used: `PROC_IMPORT` or `INFILE`."
      - name: target_table
        description: "The SAS dataset name created by the ingestion (e.g., WORK.MYDATA)."
      - name: file_type
        description: "Format of the source file (e.g., CSV, EXCELCS, XLSX)."
      - name: file_path
        description: "The cleaned path or FILEREF alias pointing to the source file."
      - name: content
        description: "The raw SQL-like/SAS code block for auditing and manual verification."