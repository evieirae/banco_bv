version: 1

models:

  - name: int_table_modernized
    description: "Dimension table containing information about modernized tables, mapping original table names to their modernized equivalents and tracking data ingestion metadata."
    columns:
      - name: table_name
        description: "Name of the modernized table."
      - name: table_name_work
        description: "Name of the work table associated with the modernized table."
      - name: table_name_origin
        description: "Original table name in the legacy system."
      - name: source_dataset
        description: "Source dataset in the legacy system."
      - name: source_name_data
        description: "Name of the data source associated with the table."
      - name: data_end_ingestion
        description: "Timestamp indicating when data ingestion was completed for this table."

