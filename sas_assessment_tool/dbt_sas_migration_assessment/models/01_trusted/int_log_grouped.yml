version: 1

models:

  - name: int_log_grouped
    description: "Intermediate model that groups and processes SAS log blocks, extracting project names, task names, performance metrics, and aggregating code blocks."
    columns:
      - name: block_id
        description: "Unique identifier for the code block, generated using SHA256 hash of log_file, log_date, user_id, file_line_number, project_name, and task_name."
        tests:
          - unique
      - name: log_file
        description: "Name of the SAS log file from which the record was extracted."
      - name: log_date
        description: "Timestamp or date when the log entry was generated."
      - name: user_id
        description: "Identifier of the user or process that executed the SAS job."
      - name: min_file_line_number
        description: "Starting line number of the block in the log file"
      - name: max_file_line_number
        description: "Ending line number of the block in the log file."
      - name: project_name
        description: "Name of the project extracted from the SAS log block."
      - name: task_name
        description: "Name of the task extracted from the SAS log block."
      - name: code_log
        description: "Complete code block content with all lines concatenated."
      - name: connection_type
        description: "Comma-separated list of connection types used in the code block."
      - name: flag_block
        description: "Sequential identifier for the code block within the log file."
      - name: real_time
        description: "Total real time elapsed for the code block execution in seconds."
      - name: memory
        description: "Total memory usage for the code block execution."
      - name: os_memory
        description: "Total operating system memory usage for the code block execution."

