version: 1

models:

  - name: fact_log_block
    description: "Fact table that aggregates SAS log execution data by project and log file, including metrics on tasks executed, code blocks, statements, and performance metrics."
    columns:
      - name: log_block_fk
        description: "Foreign key identifier for the log block, generated using xxhash64 of log_filename, project_id, and execution_timestamp."
        tests:
          - unique
      - name: log_filename
        description: "Name of the SAS log file from which the execution data was extracted."
      - name: project_id
        description: "Unique identifier for the project, generated using xxhash64 of the canonical project name (lowercased and normalized)."
      - name: project_name
        description: "Name of the project, with quotes removed from the beginning and end."
      - name: execution_timestamp
        description: "Timestamp of the first execution in the log file for this project."
      - name: execution_date
        description: "Date of the execution (extracted from execution_timestamp)."
      - name: execution_user
        description: "Identifier of the user who executed the SAS job."
      - name: tasks_executed_number
        description: "Count of distinct tasks executed in this project execution."
      - name: tasks_executed_list
        description: "Array of distinct task names executed, sorted alphabetically."
      - name: code_blocks_executed_number
        description: "Total number of code blocks executed in this project execution."
      - name: statements_executed_number
        description: "Total number of SAS statements executed across all code blocks (currently set to 0)."
      - name: execution_process_time
        description: "Total real time elapsed for the entire execution process in seconds."
