version: 1

models:
  - name: dim_project_dependencie
    description: "Dimension table that provides a consolidated view of SAS project dependencies, including lineage, code block counts, and process classification."
    columns:
      - name: project_id
        description: "Unique identifier for the project, generated from the project name."
      - name: project_name
        description: "The name of the SAS project file (e.g., .egp)."
      - name: log_file_number
        description: "The total count of distinct log files associated with a given project."
      - name: task_number
        description: "The total count of distinct tasks identified within the project's log files."
      - name: target_table
        description: "A comma-separated list of tables that are created or written to by the project."
      - name: source_table
        description: "A comma-separated list of tables that are read from or used as input by the project."
      - name: count_sql_blocks
        description: "The number of PROC SQL blocks found in the project's code."
      - name: count_python_blocks
        description: "The number of PROC PYTHON or PROC FCMP blocks, indicating use of Python or custom functions."
      - name: count_sas_blocks
        description: "The number of DATA step blocks, representing core SAS data manipulation."
      - name: variables_used
        description: "An array of key-value pairs representing SAS macro variables (%let) defined in the project."
      - name: process_type
        description: "The primary classification of the project's purpose, such as 'ETL', 'Analítico', 'Ad Hoc', or 'Modelo ML'."
