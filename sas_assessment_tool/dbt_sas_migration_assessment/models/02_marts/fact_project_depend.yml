version: 1

models:

  - name: fact_project_depend
    description: "Fact table that extracts and models data lineage relationships from SAS code, identifying dependencies between projects, tables, files, and other data objects through READ and WRITE operations."
    columns:
      - name: relationship_id
        description: "Unique identifier for each relationship, generated using xxhash64 of parent_name, relationship_type, and children_name."
        tests:
          - unique
      - name: parent_name
        description: "Name of the parent object (typically a SAS project name, extracted from project_name or .egp filename)."
      - name: parent_type
        description: "Type of the parent object (e.g., 'projeto SAS')."
      - name: relationship_type
        description: "Type of relationship: 'le' (reads) or 'escreve' (writes)."
      - name: children_name
        description: "Name of the child object (table, file, or data object) that the parent reads from or writes to. Resolved using library mappings and path information."
      - name: children_type
        description: "Type of the child object, determined based on file patterns, library mappings, and statement types (e.g., 'Tabela SAS', 'Tabela externa', 'Arquivo externo', 'WORK', 'Arquivo importado', 'Arquivo exportado')."



