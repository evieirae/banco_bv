version: 1

models:

  - name: dim_variables
    description: "Dimension table that extracts and standardizes SAS macro variables and library references (librefs) from code blocks, identifying both %LET statements and LIBNAME statements."
    columns:
      - name: project_name
        description: "Name of the project extracted from the SAS log block."
      - name: task_name
        description: "Name of the task extracted from the SAS log block."
      - name: var_type
        description: "Type of variable or reference: 'LET' for %LET macro variables or 'LIB' for LIBNAME library references."
      - name: var_name
        description: "Name of the variable (for LET) or library reference name (for LIB)."
      - name: var_value
        description: "Value assigned to the variable (for LET) or path/connection string for the library (for LIB)."
      - name: var_stmt
        description: "Complete statement text for %LET variables, or null for LIB references."

