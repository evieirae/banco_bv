version: 1

models:

  - name: dim_table
    description: "Dimension table that extracts and categorizes all tables referenced in SAS code (both sources and targets), identifying their origin (PROC SQL, DATA step, PROC IMPORT), role (SOURCE or TARGET), connection type (SAS, WORK, BIGQUERY, SYBASE, etc.), and modernization status. This model processes logs directly from staging to build statements and extract table references."
    columns:
      - name: project_name
        description: "Name of the SAS project where the table is referenced, extracted and propagated from log blocks."
      - name: task_name
        description: "Name of the task within the project where the table is referenced, extracted and propagated from log blocks."
      - name: table_name
        description: "Name of the table, normalized to uppercase. Can be a simple table name, schema.table, or database.schema.table format."
      - name: role
        description: "Role of the table in the data flow: 'SOURCE' for tables read from, or 'TARGET' for tables written to."
      - name: connection_type
        description: "Type of connection or data source for the table. Can be 'SAS' (native SAS tables), 'WORK' (temporary SAS work library), 'BIGQUERY' (Google BigQuery tables), 'SYBASE' (Sybase database), or other external connection types identified from connection statements."
      - name: is_modernized
        description: "Binary flag (0 or 1) indicating whether the table has been modernized. 1 if the table name matches a table in the int_table_modernized reference table, 0 otherwise."


