version: 1

sources:

  - name: bv_migration_sas
    schema: bv_migration_sas
    description: "Source raw data log"
    tables:

      - name: log_base
        identifier: log_base
        description: "Source table log base."
        columns:
          - name: id
            description: "Unique identifier for the log record."
          - name: log_file
            description: "Name of the SAS log file from which the record was extracted."
          - name: line_number
            description: "Original physical line number in the log file."
          - name: log_level
            description: "Level of the log message."
          - name: session_id
            description: "Identifier of the SAS session that generated the log entry."
          - name: user_id
            description: "Identifier of the user or process that executed the SAS job."
          - name: content
            description: "Block code SAS."
          - name: is_code_block
            description: "Boolean flag indicating if the log entry is part of a code block."
          - name: code_block_id
            description: "Identifier for the code block to which this log entry belongs."
          - name: code_category
            description: "Category classification of the code or log message."
          - name: area
            description: "Area or department associated with the log entry."
          - name: msg
            description: "Message content extracted from the log entry."
          - name: start_date
            description: "Start timestamp of the process or operation."
          - name: end_date
            description: "End timestamp of the process or operation."
          - name: log_date
            description: "Timestamp or date when the log entry was generated."
          - name: real_time
            description: "Real time elapsed for the process execution."
          - name: user_cpu_time
            description: "CPU time consumed by user processes."
          - name: system_cpu_time
            description: "CPU time consumed by system processes."
          - name: memory
            description: "Memory usage information for the process."
          - name: os_memory
            description: "Operating system memory usage information."
          - name: system_time
            description: "Total system time for the process."
          - name: page_faults
            description: "Number of page faults occurred during execution."
          - name: page_swaps
            description: "Number of page swaps occurred during execution."
          - name: voluntary_context_switches
            description: "Number of voluntary context switches during execution."
          - name: involuntary_context_switches
            description: "Number of involuntary context switches during execution."
          - name: step_count
            description: "Count of steps executed in the process."
          - name: switch_count
            description: "Count of switches between processes or steps."
          - name: step_timestamp
            description: "Timestamp of when a specific step was executed."
          - name: origin_script
            description: "Name or path of the original script that initiated the process."
          - name: end_script
            description: "Name or path of the script that ended the process."
          - name: type_process
            description: "Type or classification of the process."
          - name: client_project_name
            description: "Name of the client project associated with the log entry."
          - name: task
            description: "Task name or identifier associated with the log entry."
          - name: process_flow_name
            description: "Name of the process flow or workflow."
          - name: project_path
            description: "File system path of the project."
          - name: inserted_at
            description: "Timestamp when the record was inserted into the database."
          - name: _rescued_data
            description: "Additional data that was rescued or preserved during data processing."
          - name: connection_type
            description: "Type of connection used to execute for table in SAS."
          - name: alias
            description: "Alias name for the connection or data source."
          - name: HOST
            description: "Host name or address for the connection."
          - name: SERVER
            description: "Server name or identifier for the connection."
          - name: DB
            description: "Database name for the connection."
          - name: USER
            description: "Database user name for the connection."

models:

  - name: stg_log_process
    description: "Staging model that processes and cleans SAS log data, extracting code and cleaning log text content."
    columns:
      - name: log_file
        description: "Name of the SAS log file from which the record was extracted."
      - name: log_date
        description: "Timestamp or date when the log entry was generated."
      - name: file_line_number
        description: "Original physical line number in the log file."
      - name: user_id
        description: "Identifier of the user or process that executed the SAS job."
      - name: code_line_number
        description: "Parsed logical line number extracted from the beginning of the log content."
      - name: clean_text
        description: "Cleaned log text with the leading line number removed, containing only the meaningful SAS statement or analytical message."
      - name: connection_type
        description: "Type of connection used to execute for table in SAS."
