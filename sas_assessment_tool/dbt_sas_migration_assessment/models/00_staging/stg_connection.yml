version: 1

sources:

  - name: bv_migration_sas
    schema: bv_migration_sas
    description: "Source raw data log"
    tables:

      - name: connections
        identifier: connections
        description: "Source connections from log."
        columns:
          - name: log_file
            description: "Name of the SAS log file from which the record was extracted."
          - name: line_number
            description: "Original physical line number in the log file."
          - name: complete_line
            description: "Content line"
          - name: connection_type
            description: "Type of connection"
          - name: alias
            description: "Alias used to connect to external database"
          - name: host
            description: "Host"
          - name: server
            description: "Server"
          - name: db
            description: "Database"
          - name: user
            description: "User"

models:

  - name: stg_connection
    description: "Staging model that connections used in SAS log data."
    columns:
      - name: log_file
        description: "Name of the SAS log file from which the record was extracted."
      - name: line_number
        description: "Original physical line number in the log file."
      - name: complete_line
        description: "Content line"
      - name: connection_type
        description: "Type of connection"
      - name: alias
        description: "Alias used to connect to external database"