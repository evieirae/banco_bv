<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ancora todos os URLs relativos (assets do bundle + fetch("api/...")) na raiz
         do app. Sem isto, um deep-link "/egps/<id>" carregado a frio resolveria
         "./assets/..." contra "/egps/" (bundle 404 -> página em branco) e as chamadas
         "api/..." contra "/egps/api/...". O Databricks App é servido na raiz do seu
         subdomínio, então "/" é a base correta. Precede as tags injetadas pelo Vite. -->
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233b46e6'/%3E%3Crect x='7' y='18' width='4' height='8' rx='1' fill='white'/%3E%3Crect x='14' y='12' width='4' height='14' rx='1' fill='white'/%3E%3Crect x='21' y='6' width='4' height='20' rx='1' fill='white'/%3E%3C/svg%3E" />
    <title>Painel de Modernização SAS</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var t = (s === 'light' || s === 'dark') ? s
                : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
