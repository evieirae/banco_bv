# =============================================================================
# Mapa área (slug) → componente dbt + metadados git (EXEMPLO)
# =============================================================================
# Uso:
#   1. Copie para: registry/area_componente_dbt.yaml
#   2. Preencha `areas` com os mesmos slugs que `area` em registry/egp_catalog.yaml
#   3. Em `components`, use a pasta do projeto (igual a `componente_dbt` no catálogo).
#      Defina `git_url` quando o clone automático for desejado; deixe vazio "" para
#      só validar pasta existente (ex.: cópia local em converted_egps/).
#
# CLI (raiz do repo converter):
#   python -m scripts.bootstrap_egp_catalog scan --area cobranca
#       → usa `areas.cobranca` para preencher componente_dbt se omitir --componente
#   python -m scripts.bootstrap_egp_catalog ensure-repo --area cobranca
#   python -m scripts.bootstrap_egp_catalog ensure-repo --componente dbt-srcg-anlt-plataforma
#
# Guardrail: ensure-repo usa apenas clone/fetch/checkout/pull — nunca commit nem push.
# =============================================================================

schema_version: 1

# area_slug → nome da pasta do componente (mesmo valor que egp_catalog.componente_dbt)
areas:
  cobranca: dbt-srcg-anlt-plataforma
  financas: dbt-cost-anlt-plataforma
  risco: dbt-ifrs-anlt-plataforma
  operacoes: dbt-pega-anlt-plataforma
  seguros: dbt-pseg-base-plataforma
  rodas: dbt-savr-base-plataforma
  cartoes: dbt-gcoc-anlt-plataforma
  juridico: dbt-pjur-repl-plataforma-dado-juridico

# Metadados por pasta de componente (chave = componente_dbt)
components:
  dbt-cost-anlt-plataforma:
    git_url: https://github.com/bancobv-projects/dbt-cost-anlt-plataforma.git
    git_ref: main

  dbt-ifrs-anlt-plataforma:
    git_url: https://github.com/bancobv-projects/dbt-ifrs-anlt-plataforma.git
    git_ref: main

  dbt-pega-anlt-plataforma:
    git_url: https://github.com/bancobv-projects/dbt-pega-anlt-plataforma.git
    git_ref: main

  dbt-pseg-base-plataforma:
    git_url: https://github.com/bancobv-projects/dbt-pseg-base-plataforma.git
    git_ref: main

  dbt-savr-base-plataforma:
    git_url: https://github.com/bancobv-projects/dbt-savr-base-plataforma.git
    git_ref: main

  dbt-srcg-anlt-plataforma:
    git_url: https://github.com/bancobv-projects/dbt-srcg-anlt-plataforma.git
    git_ref: main

  dbt-gcoc-anlt-plataforma:
    git_url: https://github.com/bancobv-projects/dbt-gcoc-anlt-plataforma.git
    git_ref: main

  dbt-pjur-repl-plataforma-dado-juridico:
    git_url: https://github.com/bancobv-projects/dbt-pjur-repl-plataforma-dado-juridico.git
    git_ref: main
