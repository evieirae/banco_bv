# Catálogo de dados sensíveis (tipos lógicos → critério de matching em nomes de coluna).
# O agente de governança usa este ficheiro para decidir quando aplicar policy_tags nos .yml.
#
# Fonte: Lista Corporativa de Dados Pessoais (Governança de Dados + Privacidade + Segurança da Informação),
# Confluence BV — alinhamento formal nov/2023; atualizações na lista até jul/2024 conforme PDF exportado.
# Mascaramento corporativo: em geral STRING (exceto nota sobre valores monetários no rodapé do documento).
#
# Campos por entrada:
#   id: identificador estável (snake_case)
#   description: o que representa o tipo sensível (PT-BR)
#   match: lista de padrões sobre o nome físico da coluna (case-insensitive):
#          - substring simples (ex.: "nu_cpf")
#          - ou regex se começar com "re:" (ex.: 're:^nu_(cpf|cnpj)')
#   requires_pii: se true, colunas que casarem devem ter policy_tags no YAML
#   notes: opcional

schema_version: 1

entries:
  - id: cpf
    description: "CPF (cadastro de pessoa física)."
    match:
      - "nucpfcnpj"
      - "nu_cpfcnpj"
      - "nucpf"
      - "nu_cpf"
      - "cdcpf"
      - "cd_cpf"
      - "nucpfconjuge"
      - "nu_cpf_conjuge"
      - "cpf"
    requires_pii: true
    notes: "Lista corporativa: mascaramento STRING. Inclui variantes com underscore (padrão dbt)."

  - id: cnpj
    description: "CNPJ (cadastro de pessoa jurídica)."
    match:
      - "nucnpj"
      - "nu_cnpj"
      - "nucnpjempresa"
      - "nu_cnpj_empresa"
      - "cnpj"
    requires_pii: true
    notes: "Lista corporativa: mascaramento STRING."

  - id: numero_contrato
    description: "Número do contrato (identificação contratual sensível)."
    match:
      - "nucontrato"
      - "nu_contrato"
      - "cdcontrato"
      - "cd_contrato"
      - "nucontratogerencial"
      - "nu_contrato_gerencial"
      - "cdococonta"
      - "cd_ocor_conta"
      - "idchavemodelo"
      - "id_chave_modelo"
    requires_pii: true
    notes: "Nomes de campo conforme tabela corporativa (rever homónimos de negócio não pessoais)."

  - id: telefone
    description: "Número de telefone (residencial ou celular)."
    match:
      - "nutelefone"
      - "nu_telefone"
      - "telefone"
      - "nr_telefone"
      - "nu_celular"
      - "nucelular"
    requires_pii: true
    notes: "Lista corporativa cita nutelefone; estendido a sinónimos comuns."

  - id: email
    description: "E-mail ou correio eletrónico."
    match:
      - "dsemail"
      - "ds_email"
      - "email"
      - "ds_mail"
    requires_pii: true
    notes: "Lista corporativa: dsemail."

  - id: matricula_colaborador
    description: "Matrícula do colaborador (quando o colaborador é titular dos dados)."
    match:
      - "nmatricula"
      - "nu_matricula"
      - "cdmatricula"
      - "cd_matricula"
      - "numatricula"
      - "matricula_colaborador"
      - "matricula_funcionario"
    requires_pii: true

  - id: documento_identificacao
    description: "Número do documento de identificação (RG, CNH, passaporte, etc.)."
    match:
      - "nudocumento"
      - "nu_documento"
      - "nu_rg"
      - "cd_rg"
      - "nu_cnh"
      - "cd_cnh"
      - "nu_passaporte"
      - "cd_passaporte"
    requires_pii: true
    notes: "Lista corporativa: nudocumento."

  - id: nome_titular
    description: "Nome do titular dos dados."
    match:
      - "nmcliente"
      - "nm_cliente"
      - "nmpessoaexpostaplterelacionada"
      - "nm_pessoa_exposta_politicamente_relacionada"
      - "nmsocialpessoafisica"
      - "nm_social_pessoa_fisica"
      - "nmapelido"
      - "nm_apelido"
      - "nmpessoa"
      - "nm_pessoa"
    requires_pii: true

  - id: nome_conjuge
    description: "Nome do cônjuge."
    match:
      - "nmconjuge"
      - "nm_conjuge"
    requires_pii: true

  - id: nome_mae
    description: "Nome da mãe (filiação)."
    match:
      - "nmmae"
      - "nm_mae"
      - "nome_mae"
    requires_pii: true

  - id: nome_pai
    description: "Nome do pai (filiação)."
    match:
      - "nmpai"
      - "nm_pai"
      - "nome_pai"
    requires_pii: true

  - id: cep_logradouro_endereco
    description: "Endereço completo do titular (CEP, logradouro, número e complemento); lista corporativa exemplifica CEP."
    match:
      - "cdcep"
      - "cd_cep"
      - "nucep"
      - "nu_cep"
      - "dsendereco"
      - "ds_endereco"
      - "dologradouro"
      - "ds_logradouro"
      - "nulogradouro"
      - "nu_logradouro"
      - "dscomplemento"
      - "ds_complemento"
    requires_pii: true

  - id: religiao
    description: "Religião."
    match:
      - "cdreligiao"
      - "cd_religiao"
      - "dsreligiao"
      - "ds_religiao"
      - "nmreligiao"
      - "nm_religiao"
      - "flreligiao"
      - "fl_religiao"
    requires_pii: true

  - id: genero_sexo
    description: "Gênero ou sexo."
    match:
      - "cdsexo"
      - "cd_sexo"
      - "dsgenero"
      - "ds_genero"
    requires_pii: true

  - id: numero_cartao_pagamento
    description: "Número completo do cartão de pagamento."
    match:
      - "nucartao"
      - "nu_cartao"
      - "numero_cartao"
    requires_pii: true

  - id: hostname_titular
    description: "Hostname associado ao titular."
    match:
      - "dshostname"
      - "ds_hostname"
      - "nmhostname"
      - "nm_hostname"
      - "host_name"
    requires_pii: true

  - id: username_titular
    description: "Username / identificador de conta de utilizador do titular."
    match:
      - "nmusername"
      - "nm_username"
      - "dsusername"
      - "ds_username"
      - "cdlogin"
      - "cd_login"
      - "nm_usuario"
      - "cd_usuario"
    requires_pii: true

  - id: numero_conta_bancaria
    description: "Número de conta (cartão, corrente ou poupança)."
    match:
      - "nuconta"
      - "nu_conta"
      - "nucontacartao"
      - "nu_conta_cartao"
      - "nucontacorrente"
      - "nu_conta_corrente"
      - "nucontastr"
      - "nu_conta_str"
      - "nucontas57"
      - "nu_conta_s57"
    requires_pii: true

  - id: placa_veiculo
    description: "Placa do veículo."
    match:
      - "dsplaca"
      - "ds_placa"
      - "placa"
    requires_pii: true

  - id: renavam
    description: "Número do RENAVAM (registro do veículo)."
    match:
      - "nurenavan"
      - "nu_renavan"
      - "nurenavam"
      - "nu_renavam"
    requires_pii: true

  - id: chassi_veiculo
    description: "Número do chassi do veículo."
    match:
      - "nuchassi"
      - "nu_chassi"
      - "chassi"
    requires_pii: true

  - id: processo_judicial
    description: "Número de processo judicial."
    match:
      - "nuprocesso"
      - "nu_processo"
      - "nr_processo"
      - "processo_judicial"
    requires_pii: true

  - id: pcd_necessidade_especial
    description: "Identificação de pessoa com deficiência (PCD) ou com necessidade especial."
    match:
      - "flpcd"
      - "fl_pcd"
      - "fl_necessidade_especial"
    requires_pii: true

  - id: etnia_cor_raca
    description: "Identificação de etnia, cor ou raça da pessoa."
    match:
      - "cdetnia"
      - "cd_etnia"
      - "dscor"
      - "ds_cor"
      - "cdraca"
      - "cd_raca"
      - "ds_etnia"
      - "nm_cor_raca"
    requires_pii: true

  - id: chave_pix
    description: "Chave ou identificador Pix."
    match:
      - "dschavepix"
      - "ds_chave_pix"
      - "chave_pix"
    requires_pii: true

