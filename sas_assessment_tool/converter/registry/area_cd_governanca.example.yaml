# =============================================================================
# Mapa área (slug) → código de governança (cd_governanca nos labels dbt)
# =============================================================================
# Uso:
#   1. Copie este arquivo para:  area_cd_governanca.yaml  (mesma pasta registry/)
#   2. Preencha area_cd_governanca com os slugs iguais ao campo `area` do
#      egp_catalog.yaml (ex.: cobranca, credito).
#   3. Na conversão, preencha labels['cd_governanca'] com o valor string
#      correspondente à área do EGP (ex.: '22').
#
# CLI (pasta converter/): python -m scripts.bootstrap_egp_catalog governance-cd "<egp_key>"
#   Imprime o código; -v mostra area e se veio do mapa ou do default. -g altera o YAML.
#
# Referência típica de códigos (ajuste à tabela oficial da empresa):
#   1  — Clientes, Canais, Visão 360
#   3  — CRM, Campanhas
#   11 — Negócios, Rodas
#   14 — Seguros
#   20 — Crédito Varejo, Risco, Análise
#   22 — Cobrança, Dívida, Fatura
#   99 — Outros / default
# =============================================================================

schema_version: 1

# Código usado quando `area` não existir no mapa abaixo (string, entre aspas no YAML).
default_cd_governanca: "99"

# Chave = slug de `area` em registry/egp_catalog.yaml (sem espaços, minúsculas recomendadas).
area_cd_governanca:
  cobranca: "22"
  # credito: "20"
  # seguros: "14"
  # canais: "1"
  # crm: "3"
  # negocios: "11"
  # adicione mais áreas conforme o catálogo
