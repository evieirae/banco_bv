# Mapa área → componente dbt (operacional). Ver area_componente_dbt.example.yaml.
schema_version: 1

areas:
  cobranca: dbt-srcg-anlt-plataforma
  # Windows / pastas legadas: mesmo componente que `cobranca`
  Cobranca: dbt-srcg-anlt-plataforma
  financas: dbt-cost-anlt-plataforma
  risco: dbt-ifrs-anlt-plataforma
  operacoes: dbt-pega-anlt-plataforma
